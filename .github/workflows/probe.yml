name: probe-server
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where is this runner
        run: curl -s https://ipinfo.io/json

      - name: DNS
        run: getent hosts ${{ secrets.DEPLOY_HOST }} || echo "DNS failed"

      - name: TCP ports
        run: |
          for p in 22 80 443 21; do
            timeout 10 bash -c "</dev/tcp/${{ secrets.DEPLOY_HOST }}/$p" \
              && echo "$p open" || echo "$p closed/filtered"
          done

      - name: HTTP
        run: curl -sS -m 15 -o /dev/null -w "%{http_code}\n" https://${{ secrets.DEPLOY_HOST }} || echo "http failed"

      - name: SSH banner
        run: timeout 10 ssh -o StrictHostKeyChecking=no -o BatchMode=yes -p 22 nobody@${{ secrets.DEPLOY_HOST }} exit; echo "exit=$?"
